name: Verificações da plataforma

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Construir a plataforma
        run: npm run build
      - name: Validar funções, acesso e recuperação
        run: npm run check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Instalar navegadores de teste
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Construir a plataforma
        run: npm run build
      - name: Validar navegação e privacidade
        run: npm run check:browser
      - name: Guardar diagnóstico de falhas com dados fictícios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            .sites-runtime/playwright-report
            .sites-runtime/playwright-results
          retention-days: 7
