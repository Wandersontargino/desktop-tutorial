name: CoopSun - validar plataforma
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coopsun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar pnpm da versão do projeto
        run: npm install --global pnpm@11.25.0
      - name: Instalar dependências travadas
        run: pnpm install --frozen-lockfile
      - name: Testar contabilidade, privacidade e financiamento
        run: pnpm test
      - name: Verificar tipos
        run: pnpm typecheck
      - name: Compilar sem dados de produção
        run: pnpm build
