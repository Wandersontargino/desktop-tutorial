name: Instaladores Windows e Android
on:
  push:
    branches: [main]
    paths: ['windows-launcher/**', 'android-launcher/**', '.github/workflows/installers.yml', 'src/**', 'public/**', 'lib/**', 'scripts/build-platform.mjs', '.github/public-assets/**']
  pull_request:
    paths: ['windows-launcher/**', 'android-launcher/**', '.github/workflows/installers.yml', 'src/**', 'public/**', 'lib/**', 'scripts/build-platform.mjs', '.github/public-assets/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Construir e verificar instalador por usuario
        shell: pwsh
        run: ./windows-launcher/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: windows-launcher/output/
          retention-days: 14
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Construir interface instalada sem dados privados
        run: npm ci && npm run build && node android-launcher/prepare-assets.mjs && node scripts/check_native_android.mjs
      - name: Preparar SDK oficial
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar APK para assinatura local
        run: python3 android-launcher/build.py --sdk "$ANDROID_HOME" --unsigned-only
      - name: Preparar instrumentação fictícia
        run: python3 android-launcher/test-device.py --sdk "$ANDROID_HOME"
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validar aplicativo instalado sem internet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -memory 4096 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install android-launcher/build/device-tests/target-ci.apk
            adb install android-launcher/build/device-tests/checks-ci.apk
            adb shell cmd connectivity airplane-mode enable
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell svc power stayon true
            adb shell am instrument -w -r br.com.analiseeleitoralpara.tests/.InstalledAppChecks > android-launcher/output/device-checks.txt
            adb logcat -d *:W > android-launcher/output/device-runtime.txt
            cat android-launcher/output/device-checks.txt
            grep "PASS:" android-launcher/output/device-checks.txt
            grep "INSTRUMENTATION_CODE: -1" android-launcher/output/device-checks.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-para-assinatura-local
          path: android-launcher/output/
          retention-days: 14
          if-no-files-found: error
